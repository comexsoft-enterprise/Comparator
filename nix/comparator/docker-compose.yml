name: comparator

services:
  # --- PostgreSQL: Vector Storage ---
  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-myappdb}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # --- MongoDB: Raw Data Storage ---
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER1}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_USER1_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/config:/data/configdb

  # --- Neo4j: Knowledge Graph ---
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: always
    ports:
      - "7687:7687" # Bolt protocol
      - "3000:7474" # HTTP
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins


